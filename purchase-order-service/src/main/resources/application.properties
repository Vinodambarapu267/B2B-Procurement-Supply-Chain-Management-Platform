spring.application.name=purchase-order-service
server.port=8085
#database configurations
spring.datasource.url=jdbc:mysql://localhost:3306/b2bprocurement_platform
spring.datasource.username=root
spring.datasource.password=vinod267
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#eureka configuration

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#jwt secret key
jwt.secret.key=12345678901234567890123456789012345678901234567890

# supplier service feign client base url
supplier.service.base.url=http://localhost:8086/api/v1/suppliers

#actuator configurations
management.endpoints.web.exposure.include=*

#redis configurations
spring.cache.type=redis
spring.cache.cache-names=
spring.data.redis.host=localhost
spring.data.redis.port=6379

#KAFKA CONSUMER
spring.kafka.consumer.group-id=purchase-order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vinod.b2b.kafka,com.vinod.b2b.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.vinod.b2b.kafka.PurchaseRequestDecisionEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
