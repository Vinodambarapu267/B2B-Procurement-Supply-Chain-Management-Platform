name: Discovery Server CI

on:
  push:
    branches: [main, develop]
    paths:
      - "discovery-server/**"
      - "commons/**"

  pull_request:
    branches: [main, develop]
    paths:
      - "discovery-server/**"
      - "commons/**"

jobs:
  build:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: discovery-server
      service-path: discovery-server
      java-version: "21"
