name: Auth Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "auth-service/**"
      - "commons/**"

  pull_request:
    branches: [main, develop]
    paths:
      - "auth-service/**"
      - "commons/**"

jobs:
  build:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: auth-service
      service-path: auth-service
      java-version: "21"
