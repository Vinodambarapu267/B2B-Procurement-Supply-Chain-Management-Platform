name: Reporting Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "reporting-service/**"
      - "commons/**"

  pull_request:
    branches: [main, develop]
    paths:
      - "reporting-service/**"
      - "commons/**"

jobs:
  build:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: reporting-service
      service-path: reporting-service
      java-version: "21"
