spring.application.name=approval-service
server.port=8084
#database configurations
spring.datasource.url=jdbc:mysql://localhost:3306/b2bprocurement_platform
spring.datasource.username=root
spring.datasource.password=vinod267
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#eureka configuration

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#actuator configurations
management.endpoints.web.exposure.include=*

#redis configurations
spring.cache.type=redis
spring.cache.cache-names=
spring.data.redis.host=localhost
spring.data.redis.port=6379

#jwt secret key
jwt.secret.key=12345678901234567890123456789012345678901234567890

logging.level.org.springframework.security=DEBUG
# KAFKA CONSUMER
spring.kafka.consumer.group-id=purchase-request-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vinod.b2b.kafka,com.vinod.b2b.kafka.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.vinod.b2b.kafka.PurchaseRequestEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# KAFKA PRODUCER
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.info=true
