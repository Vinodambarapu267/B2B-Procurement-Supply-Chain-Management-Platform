spring.application.name=api-gateway
server.port=9091

#jwt secret key
jwt.secret.key=12345678901234567890123456789012345678901234567890

#eureka configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#actuator configurations
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only

# Auth routes
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=AuthenticationFilter

#user-service routes
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/user/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AuthenticationFilter

#procurement Service routes
spring.cloud.gateway.server.webflux.routes[2].id=procurement-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PROCUREMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/purchase-requests/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AuthenticationFilter

# approver service routes
